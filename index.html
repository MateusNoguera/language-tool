<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Tool</title>
    <script>
        const savedTheme = localStorage.getItem("preferredTheme");
        const savedLanguage = localStorage.getItem("preferredLanguage");

        document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
        document.documentElement.lang = savedLanguage === "en" ? "en" : "pt-BR";

    </script>
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>
    <header class="Header">
        <div class="HeaderContent">
            <span class="HeaderLogo">Language Tool</span>

            <div class="HeaderSettings">
                <div class="LanguageSwitcher" role="group" aria-label="Language selector">
                    <button class="LanguageOption" type="button" data-lang-value="pt-BR" aria-label="Português"> PT </button>
                    <button class="LanguageOption" type="button" data-lang-value="en" aria-label="English"> EN </button>
                </div>

                <div class="ThemeSwitcher" role="group" aria-label="Theme switcher">
                    <button class="ThemeOption" type="button" data-theme-value="light" aria-label="Light mode">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2V5"></path>
                            <path d="M12 19V22"></path>
                            <path d="M2 12H5"></path>
                            <path d="M19 12H22"></path>
                            <path d="M4.93 4.93L7.05 7.05"></path>
                            <path d="M16.95 16.95L19.07 19.07"></path>
                            <path d="M16.95 7.05L19.07 4.93"></path>
                            <path d="M4.93 19.07L7.05 16.95"></path>
                        </svg>
                    </button>

                    <button class="ThemeOption" type="button" data-theme-value="dark" aria-label="Dark mode">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3A7 7 0 0 0 21 12.8Z"></path>
                        </svg>
                    </button>
                </div>

            </div>

        </div>

    </header>

    
    <main class="MainContent">
        <section class="KanjiPractice">
            <h1 data-i18n="kanjiPracticeTitle">Prática de Kanji</h1>
            <p data-i18n="kanjiPracticeDescription">Desenhe o kanji apresentado abaixo.</p>

            <div class="KanjiReference">
                <span>日</span>
            </div>

            <div class="CanvasContainer">
                <canvas id="kanjiCanvas" width="400" height="400"></canvas>
            </div>

        </section>

    </main>


    <script type="module" src="./dist/main.js"></script>
</body>

</html>
