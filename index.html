<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Tool</title>
    <script>
        const savedTheme = localStorage.getItem("preferredTheme");
        const savedLanguage = localStorage.getItem("preferredLanguage");
        document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
        document.documentElement.lang = savedLanguage === "en" ? "en" : "pt-BR";
    </script>
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>
    <header class="Header">
        <div class="HeaderContent">
            <span class="HeaderLogo">Language Tool</span>

            <div class="HeaderSettings">
                <div class="LanguageSwitcher" role="group" aria-label="Language selector">
                    <button class="LanguageOption" type="button" data-lang-value="pt-BR" aria-label="Português"> PT </button>
                    <button class="LanguageOption" type="button" data-lang-value="en" aria-label="English"> EN </button>
                </div>

                <div class="ThemeSwitcher" role="group" aria-label="Theme switcher">
                    <button class="ThemeOption" type="button" data-theme-value="light" aria-label="Light mode">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2V5"></path>
                            <path d="M12 19V22"></path>
                            <path d="M2 12H5"></path>
                            <path d="M19 12H22"></path>
                            <path d="M4.93 4.93L7.05 7.05"></path>
                            <path d="M16.95 16.95L19.07 19.07"></path>
                            <path d="M16.95 7.05L19.07 4.93"></path>
                            <path d="M4.93 19.07L7.05 16.95"></path>
                        </svg>

                    </button>

                    <button class="ThemeOption" type="button" data-theme-value="dark" aria-label="Dark mode">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3A7 7 0 0 0 21 12.8Z"></path>
                        </svg>
                    </button>
                </div>

                <button class="SettingsButton" id="settingsButton" type="button" aria-label="Abrir configurações" aria-haspopup="dialog" aria-controls="settingsPanel" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 8.75A3.25 3.25 0 1 0 12 15.25A3.25 3.25 0 1 0 12 8.75Z"></path>
                        <path d="M19.14 12.94C19.18 12.64 19.2 12.32 19.2 12C19.2 11.68 19.18 11.36 19.14 11.06L21.03 9.59C21.2 9.46 21.25 9.22 21.15 9.03L19.35 5.97C19.25 5.78 19.02 5.7 18.82 5.77L16.6 6.67C16.12 6.3 15.59 5.99 15.02 5.77L14.69 3.41C14.66 3.2 14.48 3.05 14.27 3.05H9.73C9.52 3.05 9.34 3.2 9.31 3.41L8.98 5.77C8.41 5.99 7.88 6.3 7.4 6.67L5.18 5.77C4.98 5.7 4.75 5.78 4.65 5.97L2.85 9.03C2.75 9.22 2.8 9.46 2.97 9.59L4.86 11.06C4.82 11.36 4.8 11.68 4.8 12C4.8 12.32 4.82 12.64 4.86 12.94L2.97 14.41C2.8 14.54 2.75 14.78 2.85 14.97L4.65 18.03C4.75 18.22 4.98 18.3 5.18 18.23L7.4 17.33C7.88 17.7 8.41 18.01 8.98 18.23L9.31 20.59C9.34 20.8 9.52 20.95 9.73 20.95H14.27C14.48 20.95 14.66 20.8 14.69 20.59L15.02 18.23C15.59 18.01 16.12 17.7 16.6 17.33L18.82 18.23C19.02 18.3 19.25 18.22 19.35 18.03L21.15 14.97C21.25 14.78 21.2 14.54 21.03 14.41L19.14 12.94Z"></path>
                    </svg>

                </button>

            </div>

        </div>

    </header>

    
    <main class="MainContent">
        <section class="KanjiPractice">
            <h1 data-i18n="kanjiPracticeTitle">Prática de Kanji</h1>
            <p data-i18n="kanjiPracticeDescription">Desenhe o kanji apresentado abaixo.</p>

            <div class="KanjiReference">
                <span>日</span>
            </div>

            <div class="CanvasContainer" data-grid-mode="four">
                <svg class="CanvasGrid" viewBox="0 0 400 400" preserveAspectRatio="none" aria-hidden="true">
                    <path class="GridMajor" d="M200 0V400 M0 200H400"></path>
                    <path class="GridMinor" d="M100 0V400 M300 0V400 M0 100H400 M0 300H400"></path>
                    <path class="GridDiagonal" d="M0 0L400 400 M400 0L0 400"></path>
                </svg>
                
                <canvas id="kanjiCanvas" width="400" height="400" aria-label="Área de escrita de kanji"></canvas>

                <div class="EraserCursor" id="eraserCursor" aria-hidden="true" hidden></div>

            </div>

            <div class="CanvasToolbar" role="group" aria-label="Ferramentas de escrita">
                <button class="CanvasToolButton is-selected" id="drawToolButton" type="button" aria-pressed="true">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 19L19 12L22 15L15 22L12 19Z"></path>
                        <path d="M18 13L20 11L13 4L3 14V21H10L18 13Z"></path>
                    </svg>
                    <span data-i18n="drawTool">Desenhar</span>

                </button>

                <button class="CanvasToolButton" id="eraserToolButton" type="button" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 20H8L3 15A2 2 0 0 1 3 12L12 3A2 2 0 0 1 15 3L21 9A2 2 0 0 1 21 12L13 20"></path>
                        <path d="M7 8L16 17"></path>
                    </svg>
                    <span data-i18n="eraserTool">Borracha</span>

                </button>

                <button class="CanvasToolButton" id="clearButton" type="button" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 6H21"></path>
                        <path d="M8 6V4H16V6"></path>
                        <path d="M5 6L6 21H18L19 6"></path>
                        <path d="M10 10V17M14 10V17"></path>
                    </svg>
                    <span data-i18n="clear">Limpar</span>

                </button>

                <button class="CanvasToolButton" id="undoButton" type="button" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 14L4 9L9 4"></path>
                        <path d="M4 9H14A6 6 0 0 1 14 21H11"></path>
                    </svg>
                    <span data-i18n="undo">Desfazer</span>

                </button>

                <button class="CanvasToolButton" id="redoButton" type="button" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 14L20 9L15 4"></path>
                        <path d="M20 9H10A6 6 0 0 0 10 21H13"></path>
                    </svg>
                    <span data-i18n="redo">Refazer</span>

                </button>

            </div>

            <div class="CanvasEvaluation">
                <button class="CanvasEvaluateButton" id="evaluateKanjiButton" type="button" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 12L9 17L20 6"></path>
                    </svg>
                    <span data-i18n="evaluateKanji">Avaliar</span>
                </button>
            </div>

        </section>

    </main>
    
    <dialog class="SettingsPanel" id="settingsPanel" aria-labelledby="settingsTitle">
        <div class="SettingsHeader">
            <h2 id="settingsTitle" data-i18n="settingsTitle">Configurações</h2>

            <button class="SettingsCloseButton" id="settingsCloseButton" type="button" aria-label="Fechar configurações">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6L6 18M6 6L18 18"></path>
                </svg>

            </button>

        </div>

        <div class="SettingsContent">
            <p data-i18n="settingsDescription">Personalize sua experiência de estudo.</p>

            <section class="SettingsSection" aria-labelledby="kanjiSettingsTitle">
                <h3 id="kanjiSettingsTitle" data-i18n="kanjiSettingsTitle">Escrita de Kanji</h3>
                <fieldset class="SettingsFieldset" aria-describedby="gridSettingsDescription">
                    <legend data-i18n="gridSettingsTitle">Grade de orientação</legend>
                    <p id="gridSettingsDescription" data-i18n="gridSettingsDescription">Escolha as linhas de referência para ajudar no posicionamento dos traços.</p>
                    <div class="GridOptions">
                        <label class="GridOption">
                            <input type="radio" name="gridMode" value="none">
                            <span data-i18n="gridNone">Sem grade</span>
                        </label>
                        <label class="GridOption">
                            <input type="radio" name="gridMode" value="four" checked>
                            <span data-i18n="gridFour">4 quadrantes (2 x 2)</span>
                        </label>
                        <label class="GridOption">
                            <input type="radio" name="gridMode" value="sixteen">
                            <span data-i18n="gridSixteen">16 quadrantes (4 x 4)</span>
                        </label>
                        <label class="GridOption">
                            <input type="radio" name="gridMode" value="diagonal">
                            <span data-i18n="gridDiagonal">4 quadrantes + diagonais</span>
                        </label>

                    </div>

                </fieldset>

            </section>

        </div>

    </dialog>

    <script type="module" src="./dist/main.js"></script>

</body>

</html>
